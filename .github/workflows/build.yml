name: Build RedCat Twitch Miner

on:
  workflow_dispatch:
  push:
    branches: [redcat-v2]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RedCat project
        uses: actions/checkout@v4

      - name: Checkout upstream twitch-miner-go
        uses: actions/checkout@v4
        with:
          repository: Guliveer/twitch-miner-go
          ref: 6a5696a8e9954523588ed0aa9d3d34e8b3853da3
          path: upstream

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: upstream/go.sum

      - name: Apply RedCat integration
        run: python3 tools/apply_redcat_integration.py

      - name: Format integrated source
        working-directory: upstream
        run: gofmt -w internal/redcat/*.go internal/miner/miner.go internal/miner/handler.go

      - name: Test RedCat module
        working-directory: upstream
        run: go test ./internal/redcat

      - name: Build Windows x64
        working-directory: upstream
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags='-s -w' -o ../RedCatTwitchMiner.exe ./cmd/twitch-miner-go

      - name: Package config
        run: |
          mkdir -p release/configs
          cp configs/small_redcat.yaml release/configs/small_redcat.yaml
          cp RedCatTwitchMiner.exe release/RedCatTwitchMiner.exe
          cp README.md release/README.md 2>/dev/null || true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RedCat-Twitch-Miner-Windows-x64
          path: release/
